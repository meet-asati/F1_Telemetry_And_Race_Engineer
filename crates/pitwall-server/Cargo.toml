[package]
name = "pitwall-server"
description = "F1 pit-wall daemon: UDP ingest, race state, comms, radio audio and the web UI server"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "pitwall-server"
path = "src/main.rs"

[dependencies]
f1-udp.workspace = true
race-state.workspace = true
comms.workspace = true
voice-comms.workspace = true
ai-sidecar.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
futures-util = "0.3"
toml = "0.8"

[workspace]
resolver = "2"
members = [
    "crates/f1-udp",
    # "crates/race-state",
    # "crates/comms",
    # "crates/voice-comms",
    # "crates/ai-sidecar",
    # "crates/pitwall-server",
    # "tools/f1-synth",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
f1-udp = { path = "crates/f1-udp" }
race-state = { path = "crates/race-state" }
comms = { path = "crates/comms" }
voice-comms = { path = "crates/voice-comms" }
ai-sidecar = { path = "crates/ai-sidecar" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2

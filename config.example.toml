# F1 Pit Wall configuration. Copy to config.toml and edit.
# Every key is optional; defaults are shown.

[udp]
# In-game: Settings > Telemetry > UDP Telemetry On, UDP IP = this PC, port 20777.
bind = "0.0.0.0:20777"
# Only accept packets from these IPs (e.g. a console). Empty = accept all.
allow_from = []

[http]
# 0.0.0.0 serves LAN + Tailscale. Use your Tailscale IP (100.x.y.z:8080) to expose only on the tailnet.
bind = "0.0.0.0:8081"
# Shared token for radio / approve / mode commands. Empty = no auth.
token = ""
ui_dir = "ui/build"

[db]
path = "data/pitwall.db"

[capture]
# Record every UDP datagram to captures/ for later replay (--replay <file>).
record = false
dir = "captures"

[tts]
# The engineer's voice. "kokoro" (default), "piper" or "none" (text only).
#   Kokoro: docker run -d -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:latest
#   Piper:  python -m piper.http_server -m en_GB-alan-medium --port 5000  (url = "http://127.0.0.1:5000")
engine = "kokoro"
url = "http://127.0.0.1:8880"
# British male voices: bm_george (calm, low; default), bm_fable, bm_lewis, bm_daniel.
# Kokoro-FastAPI can blend voices, e.g. "bm_george+bm_fable".
voice = "bm_george"
model = "kokoro"
# Base speaking rate. Urgent calls are delivered ~8% quicker, routine ones ~3% calmer.
speed = 1.0
timeout_ms = 8000

[stt]
# Speech-to-text for push-to-talk. "whispercpp" (default), "openai" or "none".
#   whisper.cpp: whisper-server -m ggml-base.en.bin --port 8178
#   OpenAI-compatible (speaches / faster-whisper-server): engine = "openai", url = "http://127.0.0.1:8000"
engine = "whispercpp"
url = "http://127.0.0.1:8178"
model = "Systran/faster-whisper-base.en"
language = "en"
timeout_ms = 8000

[llm]
# Free-form driver questions. Common ones (gaps, tyres, fuel, box?) are answered
# from telemetry instantly; only the rest go to the model.
# "ollama" (default), "openai" (llama.cpp server, LM Studio ...) or "none".
#   ollama pull qwen2.5:3b
engine = "ollama"
url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"
api_key = ""
max_tokens = 90
temperature = 0.3
timeout_ms = 12000

[voice]
# Push-to-talk. In the game's controls, map a wheel button to "UDP Action 1" (or the number below).
enabled = true
# Substring of the microphone name (run with --list-audio-devices). Empty = default mic.
input_device = ""
ptt_button = 1
# "hold" = talk while held (like a real radio); "toggle" = press to start, press to stop.
ptt_mode = "hold"
# Safety cut-off if a release packet is lost.
max_ptt_ms = 15000
min_ptt_ms = 350

[audio]
enabled = true
# Substring of the output device name (run with --list-audio-devices). Empty = default device.
device = ""
cache_dir = "tts-cache"

[comms]
# "auto" speaks callouts; "copilot" queues proactive callouts for approval on the pit wall.
mode = "auto"
# Your first name; the engineer uses it now and then (praise, the finish).
driver_name = ""
override_ms = 10000
p2_max_age_ms = 20000
gate_throttle = 0.85
gate_steer = 0.15

[thresholds]
tyreWearWatch = 50.0
tyreWearCritical = 65.0
pitWearTarget = 70.0
tyreSurfaceTempWatch = 112
brakeTempWatch = 1000
fuelDeltaWatch = -0.2
fuelDeltaCritical = -0.6
ersLowPct = 10.0
componentWearWatch = 70
aeroDamageWatch = 10
aeroDamageCritical = 30
timingLineSpacingM = 50.0
